<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iリスト 単体デモ（ダミー専用・サーバなし）</title>
    <style>
      html, body, #root { margin: 0; height: 100%; }
      body { background: #0c1623; }
    </style>
  </head>
  <body>
    <!--
      サーバなしの単体デモ（ダミーデータ専用）。
      ビルド後の dist-standalone/ilist-standalone.html を file:// で直接開いて使う。
      実行時にNode・Vite・API・CDN・ネット接続を必要としない。
    -->
    <div id="root"></div>
    <!--ILIST_BOOT_DATA_START-->
    <script type="application/json" id="ilist-boot-data">null</script>
    <!--ILIST_BOOT_DATA_END-->
    <!--
      ILIST_TEMPLATE_START/END：このHTML自身の「まっさらな雛形」を文字列として持たせておく場所。
      「データ入りHTMLを保存」は file:// では自分自身を取得できない（fetch/XHRとも失敗する）ため、
      ビルド時にここへ埋め込んだ雛形文字列を使って新しいHTMLを組み立てる。
      描画済みDOMの丸ごと保存はしない（雛形は常にビルド済みのアプリコードそのもの）。
      ビルド前はプレースホルダ（空文字）。実際の雛形は scripts/inline-standalone.mjs が埋め込む。
    -->
    <!--ILIST_TEMPLATE_START-->
    <script type="text/plain" id="ilist-template"></script>
    <!--ILIST_TEMPLATE_END-->
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
