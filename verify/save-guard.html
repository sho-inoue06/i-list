<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>保存保護 検証ハーネス（ダミー専用）</title>
    <style>
      html, body { margin: 0; min-height: 100%; }
      body { background: #0c1623; }
    </style>
  </head>
  <body>
    <!--
      保存保護の検証用ページ（ダミーデータのみ）

      実行方法（npm run dev は使わない）：
        npm run dev は APIサーバも起動し、既存DB(data/ilist.db)を開いてしまう。
        モック検証に実APIも実DBも不要なので、Vite だけを単独で起動する。

        node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173 --strictPort
        → http://127.0.0.1:5173/verify/save-guard.html

        --strictPort により、ポートが埋まっていれば別ポートに移らず失敗する。
        その場合は先に起動しているプロセスを停止してから実行すること。
    -->
    <div id="runner"></div>
    <script type="module" src="/verify/save-guard.jsx"></script>
  </body>
</html>
