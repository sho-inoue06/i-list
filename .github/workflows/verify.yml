# push のたびに npm run verify を回す。成否は準備（checkout・Node・npm ci）と npm run verify の終了コードだけで決まる。
# 使うのは GitHub が自動で発行する GITHUB_TOKEN（contents: read）だけで、checkout 以外に使わない。
name: verify

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # 手元（macOS・日本時間）との違いは、verify の既存の差し替え口と環境変数だけで合わせる。
      #   CHROME_PATH：scripts/chrome-path.mjs が読む。ubuntu のランナーに入っている Google Chrome の場所。
      #   TZ：検証は端末のローカル日付で「今日」を作るので、手元と同じ日本時間にする。
      - run: npm run verify
        env:
          CHROME_PATH: /usr/bin/google-chrome
          TZ: Asia/Tokyo
